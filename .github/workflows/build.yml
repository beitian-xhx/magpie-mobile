name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fetch verified engine assets
        run: bash scripts/fetch-assets.sh

      - name: Run core contract tests
        run: gradle :core:test --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magpie-mobile-poc-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          gh release create v0.0.1-poc --title "P0-2 PoC APK" --notes "P0-2 verification APK (auto-published by CI)" --target "$GITHUB_SHA" || true
          gh release upload v0.0.1-poc app/build/outputs/apk/debug/app-debug.apk --clobber
